name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 이전에 쓰던 디버그 키스토어를 그대로 쓰려면 Secrets 에 DEBUG_KEYSTORE_BASE64 를 등록.
      # (없으면 이 단계는 건너뛰고 CI 가 새 디버그 키를 만든다)
      - name: Restore debug keystore
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: T-GPS-debug
          path: app/build/outputs/apk/debug/app-debug.apk
